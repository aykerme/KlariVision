<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1194" viewBox="0 0 834 1194" role="img" aria-label="KlariVision iPad kritik durum panosu"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif}.title{font-size:26px;font-weight:700;fill:#1C1C1E}.h{font-size:17px;font-weight:700;fill:#1C1C1E}.body{font-size:14px;fill:#1C1C1E}.small{font-size:12px;fill:#6E6E73}.link{font-size:14px;font-weight:600;fill:#0A84FF}</style><rect width="834" height="1194" fill="#F6F7FA"/><text x="40" y="58" class="title">Kritik durum panosu</text><text x="40" y="88" class="small">Her kart: simge + metin + erişilebilir durum + kurtarma eylemi</text>
<rect x="40" y="120" width="354" height="204" rx="16" fill="#FFF" stroke="#D7D9DE"/><circle cx="78" cy="158" r="18" fill="#FFF4E5"/><text x="70" y="166" font-size="16">!</text><text x="108" y="162" class="h">Dosya desteklenmiyor</text><text x="64" y="202" class="body">WAV, MP3, M4A veya desteklenen</text><text x="64" y="222" class="body">bir video dosyası seç.</text><text x="64" y="276" class="link">Başka Dosya Seç</text>
<rect x="440" y="120" width="354" height="204" rx="16" fill="#FFF" stroke="#D7D9DE"/><circle cx="478" cy="158" r="18" fill="#E8F2FF"/><text x="470" y="166" font-size="16" fill="#0A84FF">↻</text><text x="508" y="162" class="h">Analiz tamamlanamadı</text><text x="464" y="202" class="body">Yerel pitch üretimi kesildi.</text><text x="464" y="222" class="body">Çalışman korunuyor.</text><text x="464" y="276" class="link">Tekrar Dene</text>
<rect x="40" y="352" width="354" height="204" rx="16" fill="#FFF" stroke="#D7D9DE"/><circle cx="78" cy="390" r="18" fill="#FFF4E5"/><text x="70" y="398" font-size="16">●</text><text x="108" y="394" class="h">Mikrofon izni gerekli</text><text x="64" y="434" class="body">Canlı analizi başlatmak için</text><text x="64" y="454" class="body">KlariVision'a mikrofon izni ver.</text><text x="64" y="508" class="link">Ayarları Aç</text>
<rect x="440" y="352" width="354" height="204" rx="16" fill="#FFF" stroke="#D7D9DE"/><circle cx="478" cy="390" r="18" fill="#FFF0EE"/><circle cx="478" cy="390" r="6" fill="#FF453A"/><text x="508" y="394" class="h">Kayıt sürüyor</text><text x="464" y="434" class="body">Mikrofon dinleniyor ve ses</text><text x="464" y="454" class="body">yerel olarak kaydediliyor.</text><text x="464" y="508" class="link" fill="#C72F20">Kaydı Durdur</text>
<rect x="40" y="584" width="354" height="204" rx="16" fill="#FFF" stroke="#D7D9DE"/><circle cx="78" cy="622" r="18" fill="#FFF4E5"/><text x="70" y="630" font-size="16">⌁</text><text x="108" y="626" class="h">Ses oturumu kesildi</text><text x="64" y="666" class="body">Rota veya arka plan değişti.</text><text x="64" y="686" class="body">Grafik yeni veri üretmez.</text><text x="64" y="740" class="link">Mikrofonu Başlat</text>
<rect x="440" y="584" width="354" height="204" rx="16" fill="#FFF" stroke="#D7D9DE"/><circle cx="478" cy="622" r="18" fill="#FFF4E5"/><text x="470" y="630" font-size="16">53</text><text x="508" y="626" class="h">Aralık toplamı geçersiz</text><text x="464" y="666" class="body">Toplam 51 / 53 koma. Uygula</text><text x="464" y="686" class="body">düğmesi bu taslakta kapalıdır.</text><text x="464" y="740" class="link">Teoriye Dön</text>
<rect x="40" y="816" width="754" height="152" rx="16" fill="#E8F2FF" stroke="#97C9FF"/><text x="72" y="858" class="h">Eski çalışma görüntüleme geri dönüşü</text><text x="72" y="889" class="body">Yan pitch verisi bulunamadı; çalışmanın gömülü eğrisi gösteriliyor.</text><text x="72" y="922" class="link">Çalışmaya Devam Et</text><text x="40" y="1030" class="small">VoiceOver: her kartın başlığı, açıklaması ve eylemi tek mantıksal sırada okunur.</text></svg>
