<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="1032" viewBox="0 0 1376 1032" role="img" aria-label="KlariVision iPad Ana Sayfa geniş ekran">
  <style>:root{--bg:#F6F7FA;--surface:#FFF;--text:#1C1C1E;--muted:#6E6E73;--line:#D7D9DE;--blue:#0A84FF;--green:#34C759}text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif}.title{font-size:34px;font-weight:700;fill:var(--text)}.h{font-size:20px;font-weight:700;fill:var(--text)}.body{font-size:17px;fill:var(--text)}.small{font-size:13px;fill:var(--muted)}.button{font-size:17px;font-weight:600;fill:white}</style>
  <rect width="1376" height="1032" fill="var(--bg)"/><rect width="280" height="1032" fill="#FBFBFD"/><path d="M280 0V1032" stroke="var(--line)"/>
  <text x="28" y="54" class="h">⌁  KlariVision</text><text x="28" y="112" class="small">GEZİNME</text>
  <rect x="16" y="128" width="248" height="48" rx="12" fill="#E8F2FF"/><text x="32" y="158" class="body" fill="#0068C9">⌂  Ana Sayfa</text>
  <text x="32" y="218" class="body">〽  Çalışmalar</text><text x="32" y="274" class="body">☼  Ayarlar</text>
  <text x="328" y="104" class="title">Bugün nasıl çalışmak istersin?</text><text x="328" y="139" class="body" fill="#6E6E73">Yerel analizini dinle veya klarnetinle canlı çalış.</text>
  <rect x="328" y="196" width="482" height="430" rx="20" fill="#F2F8FF" stroke="#97C9FF"/><circle cx="392" cy="267" r="36" fill="#DDEEFF"/><text x="376" y="278" font-size="27" fill="#0A84FF">♬</text>
  <text x="368" y="345" class="h">Dinleme Modu</text><text x="368" y="382" class="body" fill="#6E6E73">Ses veya video dosyanı analiz et.</text><text x="368" y="408" class="body" fill="#6E6E73">Pitch eğrisini medya ile birlikte çalış.</text>
  <rect x="368" y="516" width="210" height="52" rx="14" fill="#0A84FF"/><text x="397" y="548" class="button">▣  Dosya Seç</text><text x="368" y="598" class="small">WAV, MP3, M4A ve desteklenen video</text>
  <rect x="834" y="196" width="482" height="430" rx="20" fill="#F2FBF5" stroke="#9ADDB0"/><circle cx="898" cy="267" r="36" fill="#DDF5E5"/><text x="885" y="278" font-size="27" fill="#218C41">●</text>
  <text x="874" y="345" class="h">Çalma Modu</text><text x="874" y="382" class="body" fill="#6E6E73">Mikrofonla canlı pitch analizi yap.</text><text x="874" y="408" class="body" fill="#6E6E73">Tüneri izle, kaydet ve tekrar dinle.</text>
  <rect x="874" y="516" width="180" height="52" rx="14" fill="#34C759"/><text x="904" y="548" class="button">●  Başlat</text><text x="874" y="598" class="small">Mikrofon yalnız sen başlattığında açılır</text>
  <text x="328" y="716" class="h">Son çalışmalar</text><rect x="328" y="744" width="988" height="106" rx="16" fill="var(--surface)" stroke="var(--line)"/><circle cx="376" cy="797" r="24" fill="#E8F2FF"/><text x="365" y="805" fill="#0A84FF" font-size="19">〽</text><text x="420" y="785" class="body" font-weight="600">Nihavend Taksim — prova</text><text x="420" y="814" class="small">Nihavend · La karar  ·  Bugün 14:32</text><rect x="1191" y="777" width="82" height="30" rx="15" fill="#E8F7ED"/><text x="1210" y="797" class="small" fill="#218C41">Hazır</text>
</svg>
