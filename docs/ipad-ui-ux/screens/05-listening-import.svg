<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1194" viewBox="0 0 834 1194" role="img" aria-label="Dinleme Modu dosya alma ekranı"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif}.title{font-size:34px;font-weight:700;fill:#1C1C1E}.h{font-size:20px;font-weight:700;fill:#1C1C1E}.body{font-size:17px;fill:#1C1C1E}.small{font-size:13px;fill:#6E6E73}.btn{font-size:17px;font-weight:600;fill:white}</style><rect width="834" height="1194" fill="#F6F7FA"/><rect width="834" height="80" fill="#FFF"/><path d="M0 80H834" stroke="#D7D9DE"/><text x="28" y="50" class="h">‹  Ana Sayfa</text><text x="309" y="50" class="h">Dinleme Modu</text><text x="770" y="50" font-size="22">☼</text><text x="48" y="166" class="title">Bir kayıt seç</text><text x="48" y="202" class="body" fill="#6E6E73">Ses veya video dosyan yerel olarak hazırlanacak.</text><rect x="48" y="254" width="738" height="440" rx="20" fill="#F2F8FF" stroke="#97C9FF" stroke-width="2" stroke-dasharray="8 8"/><circle cx="417" cy="392" r="58" fill="#DDEEFF"/><text x="385" y="409" font-size="48" fill="#0A84FF">⇧</text><text x="286" y="493" class="h">Dosyanı buraya bırak</text><text x="226" y="527" class="body" fill="#6E6E73">veya dosya seçiciden yerel bir kayıt aç</text><rect x="308" y="575" width="218" height="52" rx="14" fill="#0A84FF"/><text x="342" y="608" class="btn">▣  Dosya Seç</text><text x="196" y="662" class="small">WAV, MP3, M4A, AAC, AIFF, FLAC ve desteklenen video</text><rect x="48" y="744" width="738" height="116" rx="16" fill="#FFF" stroke="#D7D9DE"/><text x="76" y="781" class="h">Gizliliğin korunur</text><text x="76" y="814" class="small">Dosya, yalnızca uygulamanın yerel çalışma alanına kopyalanır.</text><text x="76" y="838" class="small">Orijinal dosyanın konumu veya erişim izni saklanmaz.</text><text x="48" y="930" class="small">İçe aktarılan çalışmanın adı, makamı ve kararı analizden sonra düzenlenebilir.</text></svg>
