on/native inputs changed. This step is the expensive one     ---\n# --- (numpy etc.), so skipping it on unrelated rebuilds matters a lot.---\nneeds_engine_build=0\nif [ ! -x \"$ENGINE_APP\" ]; then\n  needs_engine_build=1\nelif [ \"$PITCH_TRACK_CLI\" -nt \"$ENGINE_APP\" ]; then\n  needs_engine_build=1\nelif find \"$PROJECT_ROOT/src\" -name '*.py' -newer \"$ENGINE_APP\" -print -quit | grep -q .; then\n  needs_engine_build=1\nfi\n\nif [ \"$needs_engine_build\" = \"1\" ]; then\n  echo \"KlariVision: (re)building bundled Python engine (PyInstaller)…\"\n  rm -rf \"$ENGINE_DIST\" \"$ENGINE_WORK\" \"$ENGINE_SPEC\"\n  \"$PROJECT_ROOT/.venv/bin/python\" -m PyInstaller \\\n    --noconfirm \\\n    --clean \\\n    --onedir \\\n    --name KlariVisionEngine \\\n    --distpath \"$ENGINE_DIST\" \\\n    --workpath \"$ENGINE_WORK\" \\\n    --specpath \"$ENGINE_SPEC\" \\\n    --paths \"$PROJECT_ROOT/src\" \\\n    --collect-all numpy \\\n    --collect-all imageio_ffmpeg \\\n    --collect-all openpyxl \\\n    --exclude-module yt_dlp \\\n    --exclude-module curl_cffi \\\n    --exclude-module librosa \\\n    --exclude-module scipy \\\n    --exclude-module soundfile \\\n    --exclude-module numba \\\n    --exclude-module sklearn \\\n    --add-data \"$PROJECT_ROOT/data/reference/perde-esleme.xlsx:data/reference\" \\\n    --add-data \"$PROJECT_ROOT/data/reference/Turk_Muzigi_Perdeleri_ve_Mikrotonal_Notasyon.xlsx:data/reference\" \\\n    --add-binary=\"${PITCH_TRACK_CLI}:tools\" \\\n    \"$PROJECT_ROOT/src/klarivision/engine_cli.py\"\nfi\n\n# --- Step 3: copy the built engine into this build's app bundle ---\nmkdir -p \"$(dirname \"$DEST\")\"\nrm -rf \"$DEST\"\nditto \"$ENGINE_DIST/KlariVisionEngine\" \"$DEST\"\n";
